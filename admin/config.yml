backend:
  name: github
  repo: VOTRE_PSEUDO_GITHUB/VOTRE_NOM_DE_DEPOT # ⚠️ À REMPLACER par vos identifiants GitHub
  branch: main

local_backend: true

# Dossier où seront stockés les visuels importés (affiches, images)
media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "pages"
    label: "Mise à jour du site"
    delete: false # Sécurité : empêche de supprimer le fichier index.html par erreur
    files:
      - name: "index"
        label: "Page d'Accueil Directe"
        file: "index.html" # Le CMS va modifier directement ce fichier
        fields:
          - label: "Boutique du Club"
            name: "boutique_items"
            widget: "list"
            summary: "{{fields.title}} - {{fields.price}}€"
            fields:
              - {label: "Nom de l'article", name: "title", widget: "string"}
              - {label: "Prix (en €)", name: "price", widget: "string"}
              - {label: "Détails / Précisions", name: "details", widget: "string"}

          - label: "Gestion des Événements"
            name: "evenements_list"
            widget: "list"
            summary: "{{fields.title}} ({{fields.date}})"
            fields:
              - {label: "Titre de l'événement", name: "title", widget: "string"}
              - {label: "Date (Format: AAAA-MM-JJ)", name: "date", widget: "string", placeholder: "Ex: 2026-12-19"}
              - {label: "Année (Format: AAAA)", name: "year", widget: "string", placeholder: "Ex: 2026"}
              - {label: "Type d'événement", name: "type", widget: "select", options: ["tournoi", "cours", "animation"]}
              - {label: "Lieu", name: "location", widget: "string"}
              - {label: "Cadence (Optionnel)", name: "cadence", widget: "string", required: false}
              - {label: "Nombre de rondes (Optionnel)", name: "rondes", widget: "string", required: false}
              - {label: "Affiche / Image", name: "image", widget: "image", required: false}
              - {label: "Commentaire / Description", name: "description", widget: "string"}